<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vunno</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #212121;
    --sidebar: #171717;
    --surface: #2f2f2f;
    --surface-hover: #383838;
    --border: #2a2a2a;
    --text: #ececec;
    --muted: #8e8e8e;
    --muted-2: #b4b4b4;
    --accent: #d97757;
  }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SIDEBAR ── */
  aside {
    width: 260px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 16px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #171717;
  }
  .new-chat {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .12s;
    margin-bottom: 16px;
  }
  .new-chat:hover { background: var(--surface); }

  .sidebar-section {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
    margin-top: 4px;
  }

  .sidebar-field {
    padding: 6px 12px 12px;
  }
  .sidebar-field select,
  .sidebar-field textarea {
    width: 100%;
    padding: 8px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .12s;
  }
  .sidebar-field select:focus,
  .sidebar-field textarea:focus {
    border-color: #4a4a4a;
  }
  .sidebar-field textarea {
    resize: none;
    min-height: 72px;
    line-height: 1.5;
  }
  .sidebar-field select option { background: var(--sidebar); }

  .spacer { flex: 1; }
  .footer-note {
    padding: 12px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Empty state (estilo ChatGPT inicial) */
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 140px;
    text-align: center;
    pointer-events: none;
  }
  .empty > * { pointer-events: auto; }
  .empty h1 {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    color: var(--text);
  }
  .empty p {
    color: var(--muted);
    font-size: 15px;
    max-width: 420px;
    margin-bottom: 36px;
  }
  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    max-width: 560px;
    width: 100%;
  }
  .suggestion {
    padding: 14px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .12s, border-color .12s;
    line-height: 1.4;
  }
  .suggestion:hover {
    background: var(--surface);
    border-color: #3a3a3a;
  }
  .suggestion strong {
    display: block;
    font-weight: 500;
    margin-bottom: 2px;
    color: var(--text);
  }
  .suggestion span {
    color: var(--muted);
    font-size: 12.5px;
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb {
    background: #3a3a3a;
    border-radius: 4px;
  }
  #messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    max-width: 740px;
    margin: 0 auto;
    padding: 8px 24px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .msg + .msg { margin-top: 8px; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    margin-top: 2px;
  }
  .msg.assistant .avatar {
    background: var(--accent);
    color: #171717;
  }
  .msg.user .avatar {
    background: var(--surface);
    color: var(--muted-2);
  }

  .content {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  /* User messages ficam com um "cartão" subtil */
  .msg.user .content {
    background: var(--surface);
    padding: 10px 16px;
    border-radius: 12px;
    white-space: pre-wrap;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { margin-top: 6px; }

  /* Markdown styling */
  .content p { margin: 0 0 12px; }
  .content p:last-child { margin-bottom: 0; }
  .content h1, .content h2, .content h3 {
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 20px 0 10px;
    line-height: 1.3;
  }
  .content h1 { font-size: 22px; }
  .content h2 { font-size: 18px; }
  .content h3 { font-size: 16px; }
  .content ul, .content ol {
    margin: 0 0 12px 22px;
  }
  .content li { margin-bottom: 4px; }
  .content a {
    color: #79b8ff;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .content blockquote {
    border-left: 3px solid var(--border);
    padding-left: 14px;
    color: var(--muted-2);
    margin: 12px 0;
  }
  .content pre {
    background: #171717;
    padding: 16px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 14px 0;
    border: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.55;
  }
  .content code {
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    font-size: 13px;
  }
  .content :not(pre) > code {
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .content table {
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 14px;
  }
  .content th, .content td {
    padding: 8px 12px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .content th { background: var(--surface); font-weight: 600; }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--text);
    animation: blink 1s steps(2) infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── INPUT ── */
  .composer-wrap {
    padding: 12px 24px 22px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .composer {
    max-width: 740px;
    margin: 0 auto;
    position: relative;
  }
  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid #3a3a3a;
    border-radius: 26px;
    padding: 8px 8px 8px 18px;
    transition: border-color .15s;
  }
  form:focus-within { border-color: #4a4a4a; }
  form textarea {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    outline: none;
    padding: 8px 0;
    max-height: 200px;
    min-height: 24px;
  }
  form textarea::placeholder { color: var(--muted); }
  .send {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity .15s, background .15s;
  }
  .send:hover { background: #fff; }
  .send:disabled {
    background: var(--surface);
    color: var(--muted);
    cursor: not-allowed;
  }
  .send svg { width: 16px; height: 16px; }

  .hint {
    max-width: 740px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Mobile ── */
  @media (max-width: 820px) {
    aside { display: none; }
    .msg { padding: 8px 16px; }
    .composer-wrap { padding: 12px 16px 18px; }
    .empty h1 { font-size: 24px; }
    .suggestions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="brand-mark">V</div>
    <span>Vunno</span>
  </div>

  <button class="new-chat" id="newChatBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Nova conversa
  </button>

  <div class="sidebar-section">Modelo</div>
  <div class="sidebar-field">
    <select id="modelSelect">
      <option value="openai/gpt-4o-mini">GPT-4o mini</option>
      <option value="openai/gpt-4o">GPT-4o</option>
      <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
      <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
      <option value="meta-llama/llama-3.1-70b-instruct">LLaMA 3.1 70B</option>
      <option value="meta-llama/llama-3.1-8b-instruct:free">LLaMA 3.1 8B (grátis)</option>
    </select>
  </div>

  <div class="sidebar-section">Personalidade</div>
  <div class="sidebar-field">
    <textarea id="systemPrompt" placeholder="Ex: responde de forma direta e informal.">Responde em português de Portugal. Sê direto, útil e natural.</textarea>
  </div>

  <div class="spacer"></div>
  <div class="footer-note">vunno.eu</div>
</aside>

<main>
  <div class="empty" id="emptyState">
    <h1>Como posso ajudar?</h1>
    <p>Escreve uma mensagem ou escolhe uma sugestão.</p>
    <div class="suggestions">
      <button class="suggestion" data-prompt="Explica-me o que é RAG em poucas palavras.">
        <strong>Explicar RAG</strong>
        <span>o que é e para que serve</span>
      </button>
      <button class="suggestion" data-prompt="Dá-me 3 ideias de projetos para aprender programação em 2026.">
        <strong>Ideias de projetos</strong>
        <span>para aprender programação</span>
      </button>
      <button class="suggestion" data-prompt="Escreve-me um email curto a pedir uma reunião a um professor.">
        <strong>Escrever email</strong>
        <span>pedido de reunião formal</span>
      </button>
      <button class="suggestion" data-prompt="Compara Python e JavaScript para quem está a começar.">
        <strong>Python vs JavaScript</strong>
        <span>qual escolher primeiro</span>
      </button>
    </div>
  </div>

  <div id="messages"></div>

  <div class="composer-wrap">
    <div class="composer">
      <form id="chatForm">
        <textarea id="input" rows="1" placeholder="Mensagem para o Vunno..." autofocus></textarea>
        <button class="send" id="sendBtn" type="submit" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
      <div class="hint">O Vunno pode cometer erros. Verifica informação importante.</div>
    </div>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════
   ⚠️ METE A TUA CHAVE NOVA AQUI
   ════════════════════════════════════════════════════════════ */
const OPENROUTER_API_KEY = 'sk-or-v1-COLA-A-TUA-CHAVE-AQUI';
/* ════════════════════════════════════════════════════════════ */

const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const emptyState = $('emptyState');
const form = $('chatForm');
const input = $('input');
const sendBtn = $('sendBtn');
const modelSelect = $('modelSelect');
const systemPrompt = $('systemPrompt');
const newChatBtn = $('newChatBtn');

let history = JSON.parse(localStorage.getItem('vunno-history') || '[]');
let sending = false;

function saveHistory() {
  localStorage.setItem('vunno-history', JSON.stringify(history));
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderMarkdown(text) {
  const html = marked.parse(text, { breaks: true, gfm: true });
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('pre code').forEach(el => { try { hljs.highlightElement(el); } catch {} });
  return tmp.innerHTML;
}
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatarLetter = role === 'user' ? 'U' : 'V';
  div.innerHTML = `
    <div class="avatar">${avatarLetter}</div>
    <div class="content">${role === 'assistant' ? renderMarkdown(content) : escapeHtml(content)}</div>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div.querySelector('.content');
}
function renderHistory() {
  messagesEl.innerHTML = '';
  if (history.length === 0) {
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';
  for (const m of history) addMessage(m.role, m.content);
}
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
}

async function sendMessage(userText) {
  if (sending) return;
  if (OPENROUTER_API_KEY.includes('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')) {
    alert('⚠️ Mete a tua chave OpenRouter na constante OPENROUTER_API_KEY.');
    return;
  }

  sending = true;
  sendBtn.disabled = true;
  emptyState.style.display = 'none';

  history.push({ role: 'user', content: userText });
  addMessage('user', userText);
  saveHistory();

  const bubble = addMessage('assistant', '');
  bubble.innerHTML = '<span class="cursor"></span>';

  let acc = '';

  try {
    const body = {
      model: modelSelect.value,
      messages: systemPrompt.value.trim()
        ? [{ role: 'system', content: systemPrompt.value.trim() }, ...history]
        : history,
      stream: true,
    };

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
        'HTTP-Referer': location.origin || 'https://vunno.eu',
        'X-Title': 'Vunno',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`HTTP ${res.status} — ${txt.slice(0, 200)}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data || data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const token = json.choices?.[0]?.delta?.content;
          if (token) {
            acc += token;
            bubble.innerHTML = renderMarkdown(acc) + '<span class="cursor"></span>';
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }

    bubble.innerHTML = renderMarkdown(acc);
    history.push({ role: 'assistant', content: acc });
    saveHistory();
  } catch (err) {
    bubble.innerHTML = `<span style="color:#ff7b72">❌ ${escapeHtml(err.message)}</span>`;
    history.pop();
    saveHistory();
  } finally {
    sending = false;
    updateSendBtn();
    input.focus();
  }
}

function updateSendBtn() {
  sendBtn.disabled = sending || !input.value.trim();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sending) return;
  input.value = '';
  autoGrow();
  updateSendBtn();
  sendMessage(text);
});

input.addEventListener('input', () => { autoGrow(); updateSendBtn(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

newChatBtn.addEventListener('click', () => {
  if (history.length && !confirm('Começar nova conversa?')) return;
  history = [];
  saveHistory();
  renderHistory();
  input.focus();
});

document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.prompt;
    autoGrow();
    updateSendBtn();
    input.focus();
  });
});

renderHistory();
autoGrow();
input.focus();
</script>
</body>
</html>
