<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mistério da Mansão Ravenwood</title>
    <style>
        :root {
            --bg-color: #121216;
            --panel-bg: #1c1c24;
            --accent-gold: #d4af37;
            --accent-purple: #8a2be2;
            --text-color: #e0e0e6;
            --border-color: #2d2d3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 800px) {
            .game-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--accent-purple);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        /* Zona de Ações */
        .controls-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #252533;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #6a1b9a;
        }

        button.accuse-btn {
            background-color: #b22222;
        }

        button.accuse-btn:hover {
            background-color: #8b0000;
        }

        /* Histórico/Log */
        #log {
            background-color: #121216;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            color: #a0a0ab;
        }

        .log-entry {
            margin-bottom: 6px;
            border-left: 3px solid var(--accent-purple);
            padding-left: 6px;
        }

        /* Bloco de Notas */
        .notebook-category {
            margin-bottom: 15px;
        }

        .notebook-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #252533;
            cursor: pointer;
            user-select: none;
        }

        .notebook-item:hover {
            background-color: #252533;
        }

        .status-icon {
            font-weight: bold;
            width: 24px;
            text-align: center;
        }

        .status-none { color: #555; }
        .status-innocent { color: #ff4d4d; }
        .status-suspect { color: #ffeb3b; }

        /* Cartas do jogador */
        .cards-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .card {
            background: linear-gradient(135deg, #2c2c38, #1e1e26);
            border: 1px solid var(--accent-gold);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mansão Ravenwood</h1>
        <p>Um jogo de dedução e mistério estilo Cluedo</p>
    </header>

    <div class="game-container">
        
        <!-- PAINEL DE AÇÃO -->
        <div class="panel">
            <h2>🕵️ Investigação</h2>
            
            <div class="controls-group">
                <label for="select-suspect">Suspeito:</label>
                <select id="select-suspect"></select>
            </div>

            <div class="controls-group">
                <label for="select-weapon">Arma:</label>
                <select id="select-weapon"></select>
            </div>

            <div class="controls-group">
                <label for="select-room">Divisão:</label>
                <select id="select-room"></select>
            </div>

            <button onclick="makeSuggestion()">Lançar Palpite</button>
            <button class="accuse-btn" onclick="makeAccusation()">Fazer Acusação Final!</button>

            <h3 style="color: var(--accent-gold); margin-top: 20px;">📜 Diário do Caso</h3>
            <div id="log"></div>

            <h3 style="color: var(--accent-gold); margin-top: 20px;">🃏 As Tuas Cartas</h3>
            <div class="cards-container" id="player-cards"></div>
        </div>

        <!-- PAINEL DO BLOCO DE NOTAS -->
        <div class="panel">
            <h2>📝 Bloco de Notas Secundário</h2>
            <p style="font-size: 13px; color: #888; margin-top:-10px;">Clica num item para alternar: Livre ➔ ❌ Inocente ➔ ⭐ Suspeito</p>
            
            <div id="notebook-content"></div>
        </div>

    </div>

    <!-- MODAL DE FIM DE JOGO -->
    <div id="endModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-size: 28px;">Fim de Jogo</h2>
            <p id="modal-text" style="font-size: 18px; margin: 20px 0;"></p>
            <button onclick="window.location.reload()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        // Dados do Jogo
        const suspects = ["Dona Violeta", "Coronel Mostarda", "Senhor Marinho", "Doutora Oliva", "Senhora Rosa", "Professor Castanho"];
        const weapons = ["Castiçal de Prata", "Adaga de Caça", "Corda de Escalada", "Chave Inglesa", "Veneno Botânico", "Pistola Antiga"];
        const rooms = ["Hall de Entrada", "Salão de Jogos", "Biblioteca", "Cozinha", "Sala de Jantar", "Jardim de Inverno", "Escritório", "Teatro Privado", "Cave"];

        let envelope = { suspect: "", weapon: "", room: "" };
        let playerCards = [];
        let ai1Cards = [];
        let ai2Cards = [];

        // Inicializar o Jogo
        function initGame() {
            // 1. Criar o envelope secreto (O Crime)
            envelope.suspect = suspects[Math.floor(Math.random() * suspects.length)];
            envelope.weapon = weapons[Math.floor(Math.random() * weapons.length)];
            envelope.room = rooms[Math.floor(Math.random() * rooms.length)];

            // 2. Juntar o resto das cartas para distribuir
            let remainingCards = [];
            suspects.forEach(s => { if(s !== envelope.suspect) remainingCards.push({type: 'suspect', name: s}); });
            weapons.forEach(w => { if(w !== envelope.weapon) remainingCards.push({type: 'weapon', name: w}); });
            rooms.forEach(r => { if(r !== envelope.room) remainingCards.push({type: 'room', name: r}); });

            // Baralhar cartas restantes
            remainingCards.sort(() => Math.random() - 0.5);

            // 3. Distribuir entre Jogador, IA 1 e IA 2
            while(remainingCards.length > 0) {
                if(remainingCards.length > 0) playerCards.push(remainingCards.pop().name);
                if(remainingCards.length > 0) ai1Cards.push(remainingCards.pop().name);
                if(remainingCards.length > 0) ai2Cards.push(remainingCards.pop().name);
            }

            // Preencher os Menus Dropdown
            populateSelect("select-suspect", suspects);
            populateSelect("select-weapon", weapons);
            populateSelect("select-room", rooms);

            // Desenhar Bloco de Notas e Cartas
            renderNotebook();
            renderPlayerCards();
            
            logMessage("O crime aconteceu! Investiga a mansão e descobre o culpado.");
            logMessage("As tuas cartas foram marcadas automaticamente como inocentes.");
        }

        function populateSelect(id, array) {
            const select = document.getElementById(id);
            array.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item;
                opt.innerText = item;
                select.appendChild(opt);
            });
        }

        // Desenhar Bloco de Notas Interativo
        function renderNotebook() {
            const container = document.getElementById("notebook-content");
            container.innerHTML = "";

            createNotebookSection(container, "Suspeitos", suspects);
            createNotebookSection(container, "Armas", weapons);
            createNotebookSection(container, "Divisões", rooms);
        }

        function createNotebookSection(parent, title, items) {
            let catDiv = document.createElement("div");
            catDiv.className = "notebook-category";
            catDiv.innerHTML = `<h3>${title}</h3>`;

            items.forEach(item => {
                let itemDiv = document.createElement("document");
                itemDiv.className = "notebook-item";
                
                // Se o jogador já tem a carta, começa logo como Inocente (X)
                let initialStatus = playerCards.includes(item) ? "❌" : "☐";
                let initialClass = playerCards.includes(item) ? "status-innocent" : "status-none";

                itemDiv.innerHTML = `
                    <span>${item}</span>
                    <span class="status-icon ${initialClass}">${initialStatus}</span>
                `;

                itemDiv.onclick = () => {
                    const iconEl = itemDiv.querySelector(".status-icon");
                    if (iconEl.innerText === "☐") {
                        iconEl.innerText = "❌";
                        iconEl.className = "status-icon status-innocent";
                    } else if (iconEl.innerText === "❌") {
                        iconEl.innerText = "⭐";
                        iconEl.className = "status-icon status-suspect";
                    } else {
                        iconEl.innerText = "☐";
                        iconEl.className = "status-icon status-none";
                    }
                };
                catDiv.appendChild(itemDiv);
            });
            parent.appendChild(catDiv);
        }

        function renderPlayerCards() {
            const container = document.getElementById("player-cards");
            playerCards.forEach(card => {
                let div = document.createElement("div");
                div.className = "card";
                div.innerText = card;
                container.appendChild(div);
            });
        }

        function logMessage(msg) {
            const log = document.getElementById("log");
            let entry = document.createElement("div");
            entry.className = "log-entry";
            entry.innerText = msg;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight; // Auto-scroll para o fim
        }

        // Lógica do Palpite (Dedução)
        function makeSuggestion() {
            const suspect = document.getElementById("select-suspect").value;
            const weapon = document.getElementById("select-weapon").value;
            const room = document.getElementById("select-room").value;

            logMessage(`🗣️ Tu sugeres: ${suspect} com o/a ${weapon} na/o ${room}.`);

            // Verificar IA 1
            let matchAI1 = ai1Cards.filter(c => c === suspect || c === weapon || c === room);
            if(matchAI1.length > 0) {
                // Escolhe uma carta aleatória das que coincidem para mostrar
                let shown = matchAI1[Math.floor(Math.random() * matchAI1.length)];
                logMessage(`🔍 Detetive Alfa (IA 1) mostrou-te a carta: [${shown}].`);
                return;
            }

            // Verificar IA 2
            let matchAI2 = ai2Cards.filter(c => c === suspect || c === weapon || c === room);
            if(matchAI2.length > 0) {
                let shown = matchAI2[Math.floor(Math.random() * matchAI2.length)];
                logMessage(`🔍 Detetive Beta (IA 2) mostrou-te a carta: [${shown}].`);
                return;
            }

            logMessage("🤔 Ninguém conseguiu desmentir o teu palpite! Pode ser uma pista forte...");
        }

        // Lógica da Acusação Final (Fim do Jogo)
        function makeAccusation() {
            const suspect = document.getElementById("select-suspect").value;
            const weapon = document.getElementById("select-weapon").value;
            const room = document.getElementById("select-room").value;

            const modal = document.getElementById("endModal");
            const title = document.getElementById("modal-title");
            const text = document.getElementById("modal-text");

            if(suspect === envelope.suspect && weapon === envelope.weapon && room === envelope.room) {
                title.innerText = "🏆 Ganhaste o Jogo!";
                title.style.color = "#d4af37";
                text.innerHTML = `Parabéns! Descobriste a verdade.<br><br><b>Assassino:</b> ${envelope.suspect}<br><b>Arma:</b> ${envelope.weapon}<br><b>Divisão:</b> ${envelope.room}`;
            } else {
                title.innerText = "❌ Perdeste o Jogo...";
                title.style.color = "#b22222";
                text.innerHTML = `A tua acusação estava errada! O mistério continua por resolver.<br><br><b>A resposta correta era:</b><br>${envelope.suspect} com o/a ${envelope.weapon} na/o ${envelope.room}`;
            }
            modal.style.display = "flex";
        }

        // Iniciar tudo ao carregar a página
        window.onload = initGame;
    </script>
</body>
</html>
