<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Português</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input[type="text"], input[type="email"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 80%;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #333333;
        }
        .hidden {
            display: none;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #f0f0f0;
            color: #000000;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }
        .option-btn:hover {
            background-color: #e0e0e0;
        }
        #feedback {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="step-code" class="container">
        <h2>Insira o código de acesso:</h2>
        <input type="text" id="access-code" placeholder="Código">
        <br>
        <button onclick="checkCode()">Entrar</button>
    </div>

    <div id="step-email" class="container hidden">
        <h2>Antes de começar, insira o seu e-mail:</h2>
        <input type="email" id="user-email" placeholder="exemplo@email.com" required>
        <br>
        <button onclick="startQuiz()">Iniciar Quiz</button>
    </div>

    <div id="step-quiz" class="container hidden">
        <h3 id="question-number">Pergunta 1 de 10</h3>
        <p id="question-text">Texto da pergunta aqui</p>
        <div id="options" class="options-container"></div>
        <p id="feedback"></p>
    </div>

    <div id="step-final" class="container hidden">
        <h2>Quiz Concluído!</h2>
        <p>Obrigado por responder a todas as perguntas.</p>
    </div>

    <script>
        // Configuração das perguntas do Quiz (Gramática de Portugal)
        // 'rigged: true' significa que a resposta vai falhar de propósito a partir da pergunta 5
        const quizData = [
            { q: "Qual é o plural da palavra 'capitão'?", options: ["Capitães", "Capitões", "Capitanes"], correct: 0, rigged: false },
            { q: "Identifique o verbo na frase: 'O gato apanhou o rato.'", options: ["Gato", "Apanhou", "Rato"], correct: 1, rigged: false },
            { q: "Qual destas palavras é um determinante artigo definido?", options: ["Um", "O", "Este"], correct: 1, rigged: false },
            { q: "Como se escreve corretamente?", options: ["Paralizar", "Paraliziar", "Paralisar"], correct: 2, rigged: false },
            { q: "Qual é o antónimo de 'construir'?", options: ["Destruir", "Fazer", "Modificar"], correct: 0, rigged: true }, // Pergunta 5 (Rasteira)
            { q: "Qual é o sujeito da frase: 'A Maria foi à biblioteca.'?", options: ["A Maria", "Foi à biblioteca", "Biblioteca"], correct: 0, rigged: false },
            { q: "Qual destas palavras é esdrúxula (proparoxítona)?", options: ["Café", "Lâmpada", "Janela"], correct: 1, rigged: true }, // Pergunta 7 (Rasteira)
            { q: "Escolha a forma correta do verbo haver:", options: ["Há dois anos que não o vejo", "À dois anos que não o vejo", "A dois anos que não o vejo"], correct: 0, rigged: false },
            { q: "Qual é o sinónimo de 'rápido'?", options: ["Lento", "Veloz", "Perto"], correct: 1, rigged: true }, // Pergunta 9 (Rasteira)
            { q: "Indique o pronome pessoal na frase: 'Nós fomos ao cinema.'", options: ["Nós", "Fomos", "Cinema"], correct: 0, rigged: false }
        ];

        let currentQuestionIndex = 0;

        // Sons configurados no enunciado
        const soundCorrect = new Audio('alex-morgan-birthday-545484.mp3');
        const soundWrong = new Audio('peido.mp3');

        function checkCode() {
            const codeInput = document.getElementById('access-code').value;
            if (codeInput === "745") {
                document.getElementById('step-code').classList.add('hidden');
                document.getElementById('step-email').classList.remove('hidden');
            } else {
                alert("Código incorreto. Tente novamente.");
            }
        }

        function startQuiz() {
            const emailInput = document.getElementById('user-email').value;
            if (emailInput.includes('@') && emailInput.includes('.')) {
                document.getElementById('step-email').classList.add('hidden');
                document.getElementById('step-quiz').classList.remove('hidden');
                loadQuestion();
            } else {
                alert("Por favor, insira um e-mail válido.");
            }
        }

        function loadQuestion() {
            const currentQuestion = quizData[currentQuestionIndex];
            document.getElementById('question-number').innerText = `Pergunta ${currentQuestionIndex + 1} de 10`;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            document.getElementById('feedback').innerText = '';

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => handleAnswer(index);
                optionsDiv.appendChild(button);
            });
        }

        function handleAnswer(selectedIndex) {
            const currentQuestion = quizData[currentQuestionIndex];
            let isCorrect = selectedIndex === currentQuestion.correct;

            // Lógica especial de rasteira (A partir da pergunta 5, algumas dão erro propositadamente)
            if (currentQuestion.rigged) {
                isCorrect = false; 
            }

            // Ativação dos efeitos sonoros conforme as regras
            if (currentQuestionIndex < 3) {
                // Primeiras 3 perguntas: se acertar, toca parabéns
                if (isCorrect) {
                    soundCorrect.play().catch(e => console.log("Áudio bloqueado pelo navegador"));
                    document.getElementById('feedback').innerText = "Correto! Parabéns.";
                } else {
                    document.getElementById('feedback').innerText = "Incorreto.";
                }
            } else {
                // A partir da pergunta 5 (e nas rasteiras), se falhar/for forçado a falhar, toca o som indicado
                if (!isCorrect) {
                    soundWrong.play().catch(e => console.log("Áudio bloqueado pelo navegador"));
                    document.getElementById('feedback').innerText = "Errado!";
                } else {
                    document.getElementById('feedback').innerText = "Correto!";
                }
            }

            // Avança para a próxima pergunta após um pequeno compasso de espera
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showFinalScreen();
                }
            }, 1500);
        }

        function showFinalScreen() {
            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-final').classList.remove('hidden');
        }
    </script>
</body>
</html>
