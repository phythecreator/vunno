<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>História de Portugal - Neo Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-neon: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --btn-hover: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Container Principal Flutuante */
        .quiz-container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(56, 189, 248, 0.1);
            transform: translateZ(0);
            transition: all 0.4s ease;
            position: relative;
        }

        /* Barra de Progresso Moderna */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-gold));
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .difficulty {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 35px;
            color: #ffffff;
        }

        /* Botões das Respostas (Estilo Flutuante / Neumórfico Moderno) */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 24px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            color: #cbd5e1;
            transition: transform 0.2s, cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s, box-shadow 0.3s;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .option-btn:hover {
            transform: translateY(-4px) scale(1.02);
            background: var(--btn-hover);
            border-color: var(--accent-neon);
            color: #fff;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.3),
                        0 0 15px rgba(56, 189, 248, 0.1);
        }

        .option-btn:active {
            transform: translateY(-1px);
        }

        /* Ecrã Final */
        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-neon);
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--accent-neon), #0284c7);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }

        /* Overlay do Troll (Meme de 2 Segundos) */
        .troll-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .troll-image {
            max-width: 80%;
            max-height: 80%;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
            transform: translateZ(0);
        }

        /* Animação Troll pedido: Rodar, aumentar e diminuir de tamanho */
        @keyframes trollAnimation {
            0% {
                transform: rotate(0deg) scale(0.2);
                opacity: 0;
            }
            25% {
                transform: rotate(180deg) scale(1.5);
                opacity: 1;
            }
            50% {
                transform: rotate(360deg) scale(0.7);
            }
            75% {
                transform: rotate(540deg) scale(1.3);
            }
            100% {
                transform: rotate(720deg) scale(1);
                opacity: 1;
            }
        }

        .troll-active {
            animation: trollAnimation 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="quizContents">
            <div class="quiz-header">
                <span id="questionNum">Pergunta 1 de 20</span>
                <span class="difficulty">Dificuldade: 4/10</span>
            </div>
            <div class="question-text" id="questionText">A carregar pergunta...</div>
            <div class="options-grid" id="optionsGrid">
                </div>
        </div>

        <div class="result-screen" id="resultScreen">
            <h2>Quiz Concluído!</h2>
            <p>A tua pontuação final foi de:</p>
            <div class="score-display" id="scoreDisplay">0 / 20</div>
            <button class="restart-btn" onclick="restartQuiz()">Tentar Novamente</button>
        </div>
    </div>

    <div class="troll-overlay" id="trollOverlay">
        <img src="" alt="Troll'd" class="troll-image" id="trollImg">
    </div>

    <script>
        // Imagens fornecidas para alternar no troll
        const trollImages = [
            "5bba000e97f2ae347e6949b412bdb5a4.jpg",
            "3120bd485e1a17c2f5580edbeec6a060.jpg",
            "post-the-best-cat-memes-you-got-in-the-comments-please-v0-auzikor54tte1.webp",
            "1.jpg",
            "images.jpg",
            "image.jpg"
        ];

        // Banco de perguntas focadas na História de Portugal, Brasil e Colónias
        // isTroll: true significa que se responderes à correta real, ativa a rasteira do troll.
        const questions = [
            { q: "Quem foi o primeiro rei de Portugal?", options: ["D. Dinis", "D. Afonso Henriques", "D. Sancho I", "D. Manuel I"], correct: 1, isTroll: false }, // Q1 - Certa
            { q: "Em que ano Pedro Álvares Cabral chegou oficialmente ao Brasil?", options: ["1492", "1498", "1500", "1530"], correct: 2, isTroll: false }, // Q2 - Certa
            { q: "Qual foi a primeira grande riqueza explorada pelos portugueses no Brasil?", options: ["Ouro", "Cana-de-açúcar", "Café", "Pau-Brasil"], correct: 3, isTroll: false }, // Q3 - Certa
            { q: "Qual o tratado assinado em 1494 para dividir as terras descobertas entre Portugal e Castela?", options: ["Tratado de Tordesilhas", "Tratado de Windsor", "Tratado de Saragoça", "Tratado de Badajós"], correct: 0, isTroll: true }, // Q4 - Troll
            { q: "Que monarca governava Portugal na altura do fatídico sismo de Lisboa em 1755?", options: ["D. João V", "D. José I", "D. Maria I", "D. Luís I"], correct: 1, isTroll: false }, // Q5 - Certa
            { q: "Qual cidade foi escolhida para ser a primeira capital histórica do Brasil?", options: ["Rio de Janeiro", "São Paulo", "Salvador", "Recife"], correct: 2, isTroll: true }, // Q6 - Troll
            { q: "Em que ano ocorreu a Restauração da Independência, pondo fim ao Domínio Filipino?", options: ["1580", "1640", "1143", "1822"], correct: 1, isTroll: true }, // Q7 - Troll
            { q: "Que navegador luso dobrou o Cabo da Boa Esperança em 1488?", options: ["Vasco da Gama", "Fernão de Magalhães", "Bartolomeu Dias", "Pedro Álvares Cabral"], correct: 2, isTroll: false }, // Q8 - Certa
            { q: "Qual destas colónias africanas teve Luanda como o seu principal centro administrativo?", options: ["Moçambique", "Angola", "Guiné-Bissau", "Cabo Verde"], correct: 1, isTroll: true }, // Q9 - Troll
            { q: "Quem é o célebre autor da epopeia 'Os Lusíadas', que narra a viagem à Índia?", options: ["Luís de Camões", "Fernando Pessoa", "Gil Vicente", "Eça de Queiroz"], correct: 0, isTroll: true }, // Q10 - Troll
            { q: "Em qual destes séculos se iniciou de forma marcante a Expansão Marítima Portuguesa?", options: ["Século XIV", "Século XV", "Século XVI", "Século XVII"], correct: 1, isTroll: true }, // Q11 - Troll
            { q: "Qual arquipélago atlântico foi oficialmente redescoberto por Zarco e Tristão Vaz Teixeira?", options: ["Açores", "Madeira", "Cabo Verde", "São Tomé"], correct: 1, isTroll: true }, // Q12 - Troll
            { q: "Que tratado substituiu o de Tordesilhas em 1750, redefinindo o tamanho do Brasil?", options: ["Tratado de Madrid", "Tratado de Utrecht", "Tratado de Paris", "Tratado de Alcañices"], correct: 0, isTroll: true }, // Q13 - Troll
            { q: "A revolução de 5 de Outubro de 1910 terminou com qual regime em Portugal?", options: ["A Ditadura", "A República", "A Monarquia", "O Império"], correct: 2, isTroll: true }, // Q14 - Troll
            { q: "Qual navegador comandou a frota que chegou a Calecute, na Índia, em 1498?", options: ["Vasco da Gama", "Afonso de Albuquerque", "Francisco de Almeida", "Bartolomeu Dias"], correct: 0, isTroll: false }, // Q15 - Certa
            { q: "Qual era o principal enclave e colónia portuguesa na Ásia ligada ao comércio de especiarias?", options: ["Macau", "Goa", "Timor", "Malaca"], correct: 1, isTroll: true }, // Q16 - Troll
            { q: "Que jovem monarca português desapareceu misteriosamente na Batalha de Alcácer-Quibir?", options: ["D. Sebastião", "D. Manuel I", "D. Henrique", "D. João III"], correct: 0, isTroll: true }, // Q17 - Troll
            { q: "Como ficou conhecida a revolução pacífica que derrubou a ditadura salazarista em 1974?", options: ["Revolução Liberal", "Revolução dos Cravos", "Revolução de Outubro", "Golpe da República"], correct: 1, isTroll: false }, // Q18 - Certa
            { q: "Que arquipélago foi descoberto no Atlântico central a partir de 1427 por Diogo de Silves?", options: ["Madeira", "Canárias", "Açores", "Cabo Verde"], correct: 2, isTroll: true }, // Q19 - Troll
            { q: "Qual foi o último território ultramarino a ser devolvido por Portugal (à China em 1999)?", options: ["Hong Kong", "Goa", "Macau", "Timor-Leste"], correct: 2, isTroll: true } // Q20 - Troll
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let trollImageIndex = 0;

        function loadQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            
            // Atualizar contadores e interface
            document.getElementById("questionNum").innerText = `Pergunta ${currentQuestionIndex + 1} de 20`;
            document.getElementById("questionText").innerText = currentQuestion.q;
            
            const progressBar = document.getElementById("progressBar");
            progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

            // Limpar e injetar novas opções com efeito flutuante
            const optionsGrid = document.getElementById("optionsGrid");
            optionsGrid.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.classList.add("option-btn");
                button.innerText = option;
                button.onclick = () => checkAnswer(index);
                optionsGrid.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            
            // Se for uma pergunta Troll e o jogador carregar na resposta historicamente "Certa"
            if (currentQuestion.isTroll && selectedIndex === currentQuestion.correct) {
                triggerTrollEffect();
                return; // Impede ganho de pontos e lida com o avanço no temporizador do troll
            } 
            
            // Logica normal para perguntas não-troll ou se escolheu uma "errada" nas perguntas trocadas
            if (selectedIndex === currentQuestion.correct) {
                score++;
            } else if (currentQuestion.isTroll && selectedIndex !== currentQuestion.correct) {
                // Nas trocadas, clicar na errada dá o ponto e safa o utilizador do troll!
                score++;
            }

            nextQuestion();
        }

        function triggerTrollEffect() {
            const overlay = document.getElementById("trollOverlay");
            const img = document.getElementById("trollImg");

            // Define e roda a lista de imagens de memes fornecida
            img.src = trollImages[trollImageIndex];
            trollImageIndex = (trollImageIndex + 1) % trollImages.length;

            // Ativa o display e a animação CSS customizada de 2 segundos
            overlay.style.display = "flex";
            img.classList.add("troll-active");

            // Bloqueia o ecrã por exatamente 2000 milissegundos (2 segundos)
            setTimeout(() => {
                img.classList.remove("troll-active");
                overlay.style.display = "none";
                nextQuestion(); // Avança após o susto do troll
            }, 2000);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quizContents").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            document.getElementById("scoreDisplay").innerText = `${score} / ${questions.length}`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            trollImageIndex = 0;
            document.getElementById("quizContents").style.display = "block";
            document.getElementById("resultScreen").style.display = "none";
            loadQuestion();
        }

        // Inicializar o Quiz ao carregar a página
        window.onload = loadQuestion;
    </script>
</body>
</html>
