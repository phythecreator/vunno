<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vunno Monitor | Greve Geral</title>
    <!-- Tailwind para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- O teu ficheiro de estilos customizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-blue-400">VUNNO.EU // GREVE</h1>
            <div id="user-profile" class="flex items-center gap-3">
                <!-- Botão de login ou perfil do utilizador (gerido pelo JS) -->
                <button onclick="toggleModal('auth-modal')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition text-sm">
                    Entrar / Registar
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-8 mt-6">
        
        <!-- SECÇÃO 1: VOTAÇÃO -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Card Comboios -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-lg font-bold">🚆 Comboios e Transportes</h2>
                    <span id="votos-total-comboios" class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-400">0 votos</span>
                </div>
                <div class="flex gap-3">
                    <button onclick="registarVoto('comboios', 'greve')" class="flex-1 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/40 py-3 rounded-lg font-semibold transition">
                        Parado 🛑
                    </button>
                    <button onclick="registarVoto('comboios', 'ok')" class="flex-1 bg-green-500/20 hover:bg-green-500/30 text-green-400 border border-green-500/40 py-3 rounded-lg font-semibold transition">
                        A Funcionar 🟢
                    </button>
                </div>
            </div>

            <!-- Card Escolas -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-lg font-bold">🏫 Escolas e Universidades</h2>
                    <span id="votos-total-escolas" class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-400">0 votos</span>
                </div>
                <div class="flex gap-3">
                    <button onclick="registarVoto('escolas', 'greve')" class="flex-1 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/40 py-3 rounded-lg font-semibold transition">
                        Sem Aulas 🛑
                    </button>
                    <button onclick="registarVoto('escolas', 'ok')" class="flex-1 bg-green-500/20 hover:bg-green-500/30 text-green-400 border border-green-500/40 py-3 rounded-lg font-semibold transition">
                        Com Aulas 🟢
                    </button>
                </div>
            </div>
        </section>

        <!-- SECÇÃO 2: COMENTÁRIOS -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-6">
            <h3 class="text-xl font-bold border-b border-slate-700 pb-3">Discussão em Tempo Real</h3>
            
            <!-- Caixa para novo comentário principal -->
            <div id="comment-form-container" class="space-y-3">
                <textarea id="novo-comentario-txt" placeholder="Escreve o teu comentário ou relato da tua zona..." rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
                <div class="flex justify-end">
                    <button onclick="enviarComentario(null)" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg font-semibold text-sm transition">Publicar</button>
                </div>
            </div>

            <!-- Feed de Comentários (Gerido dinamicamente pelo JS) -->
            <div id="comments-feed" class="space-y-4 pt-4">
                <!-- Os comentários e respostas vão aparecer aqui dentro -->
            </div>
        </section>
    </main>

    <!-- MODAL 1: AUTENTICAÇÃO (LOGIN/REGISTO) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/70 flex justify-center items-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl max-w-sm w-full space-y-4 shadow-2xl">
            <h4 class="text-xl font-bold text-center text-blue-400">Entrar na Plataforma</h4>
            <input type="text" id="auth-username" placeholder="Teu Nome / Nickname" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
            <input type="email" id="auth-email" placeholder="Teu Email" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
            <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
            <button onclick="executarAuth()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-semibold transition text-sm">Confirmar</button>
            <button onclick="toggleModal('auth-modal')" class="w-full text-xs text-slate-400 hover:underline">Fechar</button>
        </div>
    </div>

    <!-- MODAL 2: CUSTOMIZAÇÃO DE AVATAR -->
    <div id="avatar-modal" class="hidden fixed inset-0 bg-black/70 flex justify-center items-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl max-w-sm w-full space-y-4 text-center">
            <h4 class="text-lg font-bold">Escolhe o teu Avatar</h4>
            <!-- Grelha de Emojis/Avatares para escolher -->
            <div class="grid grid-cols-4 gap-4 py-2">
                <button onclick="selecionarAvatar('🥷')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🥷</button>
                <button onclick="selecionarAvatar('🤖')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🤖</button>
                <button onclick="selecionarAvatar('🦊')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🦊</button>
                <button onclick="selecionarAvatar('👻')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">👻</button>
                <button onclick="selecionarAvatar('🐱')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🐱</button>
                <button onclick="selecionarAvatar('👾')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">👾</button>
                <button onclick="selecionarAvatar('🐸')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🐸</button>
                <button onclick="selecionarAvatar('🦁')" class="avatar-option text-3xl p-2 bg-slate-900 rounded-lg hover:bg-slate-700 transition">🦁</button>
            </div>
            <button onclick="toggleModal('avatar-modal')" class="text-xs text-slate-400 hover:underline">Concluído</button>
        </div>
    </div>

    <!-- O teu script principal -->
    <script src="app.js"></script>
</body>
</html>
