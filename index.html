<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meccha Chameleon - Edição HTML Única</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: linear-gradient(#ff00aa, #00ffff);
            padding: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #fff;
        }
        #game-container {
            flex: 1;
            display: flex;
            position: relative;
        }
        canvas {
            image-rendering: pixelated;
            background: #000;
            display: block;
            margin: auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            pointer-events: auto;
        }
        button {
            background: #ff00aa;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00ffff;
            color: #000;
        }
        #paint-tools {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 90%;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        #timer {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00aa;
        }
        #status {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px #000;
        }
        .map-select {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>MECCHA CHAMELEON - Versão HTML Única (Alta Qualidade)</header>
    
    <div id="game-container">
        <canvas id="game" width="1200" height="700"></canvas>
        
        <div id="ui">
            <h2>Modo: <span id="mode">Hider</span></h2>
            <button onclick="startGame()">Novo Jogo</button>
            <button onclick="toggleRole()">Trocar Papel (Hider/Seeker)</button>
            
            <div class="map-select">
                <button onclick="changeMap(0)">Mapa 1: Sala Colorida</button>
                <button onclick="changeMap(1)">Mapa 2: Floresta</button>
                <button onclick="changeMap(2)">Mapa 3: Cidade Neon</button>
            </div>
            
            <div style="margin-top:10px;">
                <label>Bots: <span id="bot-count">4</span></label>
                <input type="range" id="bots-slider" min="1" max="8" value="4" oninput="updateBots(this.value)">
            </div>
        </div>
        
        <div id="timer">Tempo: 60s</div>
        <div id="status">Prepare-se para pintar!</div>
        
        <div id="paint-tools">
            <div class="color-btn" style="background:#ffffff;" onclick="setColor('#ffffff')"></div>
            <div class="color-btn" style="background:#ff0000;" onclick="setColor('#ff0000')"></div>
            <div class="color-btn" style="background:#00ff00;" onclick="setColor('#00ff00')"></div>
            <div class="color-btn" style="background:#0000ff;" onclick="setColor('#0000ff')"></div>
            <div class="color-btn" style="background:#ffff00;" onclick="setColor('#ffff00')"></div>
            <div class="color-btn" style="background:#ff00ff;" onclick="setColor('#ff00ff')"></div>
            <div class="color-btn" style="background:#00ffff;" onclick="setColor('#00ffff')"></div>
            <div class="color-btn" style="background:#ffa500;" onclick="setColor('#ffa500')"></div>
            <div class="color-btn" style="background:#800080;" onclick="setColor('#800080')"></div>
            <button onclick="clearPaint()">Limpar Pintura</button>
            <button onclick="randomPaint()">Pintura Aleatória</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let isHider = true;
        let timeLeft = 60;
        let timerInterval;
        let gameRunning = false;
        let currentMap = 0;
        let botCount = 4;
        
        // Cores
        let currentColor = '#ffffff';
        let painting = false;
        
        // Posição do jogador (Hider)
        let player = { x: 400, y: 350, size: 80, angle: 0 };
        
        // Pintura do jogador (array de pixels ou camadas simples)
        let playerPaint = new Map(); // key: `${x},${y}`, value: color
        
        // Bots (Seekers)
        let bots = [];
        
        // Map backgrounds
        let backgrounds = [
            // Mapa 1: Sala Colorida
            () => {
                ctx.fillStyle = '#223344';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Paredes e objetos
                ctx.fillStyle = '#ff88aa';
                ctx.fillRect(100, 100, 300, 400); // sofá
                ctx.fillStyle = '#88ffaa';
                ctx.fillRect(700, 200, 250, 300); // planta
                ctx.fillStyle = '#ffff88';
                ctx.fillRect(500, 400, 150, 150); // mesa
            },
            // Mapa 2: Floresta
            () => {
                ctx.fillStyle = '#113322';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#228822';
                for (let i = 0; i < 15; i++) {
                    ctx.fillRect(80 + i*70, 100 + Math.sin(i)*50, 60, 500);
                }
            },
            // Mapa 3: Cidade Neon
            () => {
                ctx.fillStyle = '#112233';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 8;
                for (let i = 0; i < 8; i++) {
                    ctx.beginPath();
                    ctx.moveTo(100 + i*150, 0);
                    ctx.lineTo(150 + i*120, canvas.height);
                    ctx.stroke();
                }
            }
        ];
        
        function drawBackground() {
            backgrounds[currentMap]();
            
            // Detalhes extras para qualidade
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 40; i++) {
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 3, 3);
            }
        }
        
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Corpo base (chameleon branco)
            ctx.fillStyle = '#eeeeee';
            ctx.beginPath();
            ctx.ellipse(0, 0, player.size/2, player.size/1.6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Cabeça
            ctx.fillStyle = '#dddddd';
            ctx.beginPath();
            ctx.arc(35, -15, 25, 0, Math.PI*2);
            ctx.fill();
            
            // Olhos
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(45, -22, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(47, -24, 3, 0, Math.PI*2);
            ctx.fill();
            
            // Aplicar pintura
            ctx.globalAlpha = 0.9;
            playerPaint.forEach((color, key) => {
                const [px, py] = key.split(',').map(Number);
                ctx.fillStyle = color;
                ctx.fillRect(px - player.x + 20, py - player.y - 40, 12, 12);
            });
            ctx.globalAlpha = 1;
            
            ctx.restore();
        }
        
        function drawBots() {
            bots.forEach(bot => {
                ctx.save();
                ctx.translate(bot.x, bot.y);
                
                // Seeker (figura vermelha simples)
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(-25, -45, 50, 90);
                
                // Cabeça
                ctx.beginPath();
                ctx.arc(0, -55, 20, 0, Math.PI*2);
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawPlayer();
            drawBots();
            
            // Movimento simples do jogador (WASD)
            if (keys['w'] || keys['ArrowUp']) player.y -= 5;
            if (keys['s'] || keys['ArrowDown']) player.y += 5;
            if (keys['a'] || keys['ArrowLeft']) { player.x -= 5; player.angle = -0.2; }
            if (keys['d'] || keys['ArrowRight']) { player.x += 5; player.angle = 0.2; }
            
            // Limites
            player.x = Math.max(50, Math.min(canvas.width - 50, player.x));
            player.y = Math.max(50, Math.min(canvas.height - 50, player.y));
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        // Pintura com mouse
        canvas.addEventListener('mousedown', e => {
            if (!isHider || !gameRunning) return;
            painting = true;
            paintAt(e);
        });
        
        canvas.addEventListener('mousemove', e => {
            if (painting) paintAt(e);
        });
        
        canvas.addEventListener('mouseup', () => painting = false);
        canvas.addEventListener('mouseleave', () => painting = false);
        
        function paintAt(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            // Pintar área ao redor do cursor se perto do jogador
            const dx = mx - player.x;
            const dy = my - player.y;
            if (Math.sqrt(dx*dx + dy*dy) < player.size * 1.2) {
                for (let i = -12; i < 12; i += 4) {
                    for (let j = -12; j < 12; j += 4) {
                        if (Math.random() > 0.4) {
                            const key = `${Math.floor(player.x + dx + i)},${Math.floor(player.y + dy + j)}`;
                            playerPaint.set(key, currentColor);
                        }
                    }
                }
            }
        }
        
        function setColor(color) {
            currentColor = color;
        }
        
        function clearPaint() {
            playerPaint.clear();
        }
        
        function randomPaint() {
            clearPaint();
            const colors = ['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff'];
            for (let i = 0; i < 120; i++) {
                const key = `${Math.floor(Math.random()*player.size*1.5 - player.size/2)},${Math.floor(Math.random()*player.size*1.5 - player.size/2)}`;
                playerPaint.set(key, colors[Math.floor(Math.random()*colors.length)]);
            }
        }
        
        function startTimer() {
            timeLeft = 60;
            document.getElementById('timer').textContent = `Tempo: ${timeLeft}s`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `Tempo: ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    endRound();
                }
            }, 1000);
        }
        
        function startGame() {
            gameRunning = true;
            playerPaint.clear();
            player.x = 300 + Math.random() * 600;
            player.y = 250 + Math.random() * 300;
            
            // Gerar bots
            bots = [];
            for (let i = 0; i < botCount; i++) {
                bots.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 100 + Math.random() * (canvas.height - 200)
                });
            }
            
            startTimer();
            document.getElementById('status').textContent = isHider ? "Pinte e esconda-se!" : "Encontre os camaleões!";
            gameLoop();
        }
        
        function endRound() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('status').textContent = isHider ? "Fim da rodada! Você sobreviveu?" : "Rodada terminada!";
        }
        
        function toggleRole() {
            isHider = !isHider;
            document.getElementById('mode').textContent = isHider ? "Hider" : "Seeker";
            document.getElementById('status').textContent = "Papel trocado!";
        }
        
        function changeMap(mapIndex) {
            currentMap = mapIndex;
            if (gameRunning) startGame();
        }
        
        function updateBots(val) {
            botCount = parseInt(val);
            document.getElementById('bot-count').textContent = botCount;
        }
        
        // Inicialização
        window.onload = () => {
            document.getElementById('status').textContent = "Bem-vindo ao Meccha Chameleon! Clique em Novo Jogo.";
            // Demo inicial
            drawBackground();
            drawPlayer();
        };
        
        // Dicas de alta qualidade
        console.log("%cMeccha Chameleon HTML - Divirta-se! Use WASD para mover e clique para pintar.", "color:#00ffff; font-size:16px");
    </script>
</body>
</html>
