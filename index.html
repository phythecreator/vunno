<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Cultura Geral</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            z-index: 1;
        }
        input[type="text"], textarea {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 85%;
            margin-bottom: 15px;
            text-align: center;
        }
        textarea {
            height: 100px;
            resize: none;
            text-align: left;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #333333;
        }
        .hidden {
            display: none !important;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #f9f9f9;
            color: #000000;
            border: 1px solid #ccc;
            padding: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }
        .option-btn:hover {
            background-color: #e9e9e9;
        }
        #feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        /* Overlay de transição para as imagens e vídeos */
        #media-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #media-overlay img, #media-overlay video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- PASSO 1: Código de Acesso -->
    <div id="step-code" class="container">
        <h2>Insira o código de acesso:</h2>
        <input type="text" id="access-code" placeholder="Código">
        <br>
        <button onclick="checkCode()">Entrar</button>
    </div>

    <!-- PASSO 2: O Quiz -->
    <div id="step-quiz" class="container hidden">
        <h3 id="question-number">Pergunta 1 de 15</h3>
        <p id="question-text" style="font-size: 18px; font-weight: bold;"></p>
        <div id="options" class="options-container"></div>
        <p id="feedback"></p>
    </div>

    <!-- Ecrã Intermédio de Média -->
    <div id="media-overlay" class="hidden">
        <div id="media-content"></div>
    </div>

    <!-- PASSO 3: Ecrã Final com Mensagem e Partilha -->
    <div id="step-final" class="container hidden">
        <h2>Did you like this quiz?</h2>
        <p>If yes you can write a message for the owner ( Pedro Silva )</p>
        <textarea id="owner-message" placeholder="Escreve aqui a tua mensagem para o Pedro..."></textarea>
        <br>
        <button onclick="shareWhatsApp()">Partilhar no WhatsApp</button>
    </div>

    <script>
        // 15 Perguntas de Cultura Geral (Nível Intermédio) com rasteiras intercaladas a partir da Q5
        const quizData = [
            { q: "Qual é a capital da Austrália?", options: ["Sydney", "Melbourne", "Canberra"], correct: 2, rigged: false },
            { q: "Qual é o maior oceano do planeta Terra?", options: ["Oceano Atlântico", "Oceano Pacífico", "Oceano Índico"], correct: 1, rigged: false },
            { q: "Que elemento químico é representado pelo símbolo 'Au'?", options: ["Ouro", "Prata", "Cobre"], correct: 0, rigged: false },
            { q: "Quem escreveu a famosa obra 'Os Lusíadas'?", options: ["Fernando Pessoa", "Luís de Camões", "Eça de Queirós"], correct: 1, rigged: false },
            { q: "Quantos continentes existem oficialmente no modelo geográfico mais comum?", options: ["5", "6", "7"], correct: 2, rigged: true }, // Q5 Rasteira
            { q: "Quem pintou o quadro 'Mona Lisa'?", options: ["Vincent van Gogh", "Leonardo da Vinci", "Pablo Picasso"], correct: 1, rigged: false },
            { q: "Qual é a moeda oficial do Japão?", options: ["Yen", "Won", "Yuan"], correct: 0, rigged: true }, // Q7 Rasteira
            { q: "Qual é o maior órgão do corpo humano?", options: ["Fígado", "Coração", "Pele"], correct: 2, rigged: false },
            { q: "Qual é o planeta mais próximo do Sol?", options: ["Vénus", "Mercúrio", "Marte"], correct: 1, rigged: true }, // Q9 Rasteira
            { q: "Em que país fica localizado o monumento Taj Mahal?", options: ["Índia", "Egito", "Turquia"], correct: 0, rigged: false },
            { q: "Que gás as plantas absorvem durante a fotossíntese?", options: ["Oxigénio", "Dióxido de Carbono", "Azoto"], correct: 1, rigged: true }, // Q11 Rasteira
            { q: "Quem é o autor da peça de teatro 'Hamlet'?", options: ["William Shakespeare", "Charles Dickens", "Miguel de Cervantes"], correct: 0, rigged: false },
            { q: "A que temperatura (em graus Celsius) a água ferve ao nível do mar?", options: ["90°C", "100°C", "120°C"], correct: 1, rigged: true }, // Q13 Rasteira
            { q: "Que país venceu o campeonato de futebol UEFA Euro 2016?", options: ["França", "Alemanha", "Portugal"], correct: 2, rigged: false },
            { q: "Qual é o elemento químico mais leve e abundante do universo?", options: ["Hélio", "Hidrogénio", "Oxigénio"], correct: 1, rigged: true } // Q15 Rasteira
        ];

        // Sequência de 15 ficheiros de média com os tempos exatos pedidos
        const mediaSequence = [
            { file: "viwj.jpeg", type: "image", time: 6000 },
            { file: "ua.jpeg", type: "image", time: 6000 },
            { file: "jydhdh.jpeg", type: "image", time: 6000 },
            { file: "Cursed.webp", type: "image", time: 6000 },
            { file: "nih.jpeg", type: "image", time: 6000 },
            { file: "dangee.mp4", type: "video", time: 5000 },
            { file: "nig55piy.jpeg", type: "image", time: 6000 },
            { file: "gisaltbihapp.jpeg", type: "image", time: 6000 },
            { file: "ronny.mp4", type: "video", time: 7000 },
            { file: "auwuj.jpeg", type: "image", time: 6000 },
            { file: "son333345424.mp4", type: "video", time: 6000 },
            { file: "opticjs.jpeg", type: "image", time: 3000 },
            { file: "nihao.webp", type: "image", time: 6000 },
            { file: "vidik33.mp4", type: "video", time: 4500 },
            { file: "loriu838.jpeg", type: "image", time: 6000 }
        ];

        let currentQuestionIndex = 0;

        const soundCorrect = new Audio('alex-morgan-birthday-545484.mp3');
        const soundWrong = new Audio('peido.mp3');

        function checkCode() {
            if (document.getElementById('access-code').value === "53") {
                document.getElementById('step-code').classList.add('hidden');
                document.getElementById('step-quiz').classList.remove('hidden');
                loadQuestion();
            } else {
                alert("Código incorreto.");
            }
        }

        function loadQuestion() {
            const currentQuestion = quizData[currentQuestionIndex];
            document.getElementById('question-number').innerText = `Pergunta ${currentQuestionIndex + 1} de 15`;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            document.getElementById('feedback').innerText = '';

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => handleAnswer(index);
                optionsDiv.appendChild(button);
            });
        }

        function handleAnswer(selectedIndex) {
            const currentQuestion = quizData[currentQuestionIndex];
            let isCorrect = selectedIndex === currentQuestion.correct;

            if (currentQuestion.rigged) {
                isCorrect = false; 
            }

            if (currentQuestionIndex < 3) {
                if (isCorrect) {
                    soundCorrect.play().catch(e => {});
                    document.getElementById('feedback').innerText = "Correto! Parabéns.";
                } else {
                    document.getElementById('feedback').innerText = "Incorreto.";
                }
            } else {
                if (!isCorrect) {
                    soundWrong.play().catch(e => {});
                    document.getElementById('feedback').innerText = "Errado!";
                } else {
                    document.getElementById('feedback').innerText = "Correto!";
                }
            }

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            // Aguarda 1.5s com o feedback no ecrã antes de rodar o intervalo de média
            setTimeout(() => {
                currentQuestionIndex++;
                showMediaInterval();
            }, 1500);
        }

        function showMediaInterval() {
            const overlay = document.getElementById('media-overlay');
            const content = document.getElementById('media-content');
            const currentMedia = mediaSequence[currentQuestionIndex - 1];

            content.innerHTML = '';
            
            if (currentMedia.type === 'video') {
                content.innerHTML = `<video src="${currentMedia.file}" autoplay loop muted playsinline></video>`;
            } else {
                content.innerHTML = `<img src="${currentMedia.file}" alt="Loading...">`;
            }

            overlay.classList.remove('hidden');

            setTimeout(() => {
                overlay.classList.add('hidden');
                content.innerHTML = '';
                
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showFinalScreen();
                }
            }, currentMedia.time);
        }

        function showFinalScreen() {
            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-final').classList.remove('hidden');
        }

        function shareWhatsApp() {
            const messageText = document.getElementById('owner-message').value;
            if (!messageText.trim()) {
                alert("Por favor, escreve uma mensagem antes de partilhar.");
                return;
            }
            
            const formattedMessage = `Olá Pedro Silva! Enviei feedback sobre o teu Quiz: "${messageText}"`;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(formattedMessage)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
