<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceQuiz 9º Ano - Plataforma Educativa</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
        }

        /* Header Estilo Startup */
        header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 40px;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
        }

        .progress-bar-bg {
            width: 200px;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 700px;
            padding: 2.5rem;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .card.hidden {
            display: none;
        }

        .card.animate-in {
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text);
            line-height: 1.3;
        }

        .question-tag {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 1.2rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-weight: 500;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f5f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Start & Result Screens */
        .hero-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.4);
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, #e5e7eb 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 2rem;
            position: relative;
        }

        .score-inner {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .score-label {
            font-size: 0.9rem;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .error-list {
            text-align: left;
            margin-top: 2rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .error-item {
            background: #f9fafb;
            border-left: 4px solid var(--error);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }

        .error-q {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .error-ans {
            font-size: 0.9rem;
            color: #065f46;
            background: #d1fae5;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- O LOGO: Substitua 'image.png' pelo nome do seu arquivo se for diferente -->
            <img src="image.png" alt="Logo" class="logo-img" onerror="this.style.display='none'; document.querySelector('.alt-logo').style.display='block'">
            <div class="alt-logo" style="display:none; font-size:2rem; font-weight:bold; color:var(--primary);">🧪</div>
            <span class="brand-name">ScienceStart</span>
        </div>
        <div class="progress-container" id="progress-container">
            <span id="question-count">1/15</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </header>

    <main>
        <!-- Tela Inicial -->
        <div id="start-screen" class="card animate-in">
            <h1 class="hero-title">Desafio de Ciências 9º Ano</h1>
            <p class="hero-desc">Teste seus conhecimentos sobre a origem do mundo, física, química e experimentos fundamentais.</p>
            <p style="margin-bottom: 2rem; color: var(--text-light);">15 perguntas • Estilo Quiz • Feedback Instantâneo</p>
            <button class="btn-primary" onclick="startQuiz()">Começar Desafio</button>
        </div>

        <!-- Tela de Pergunta -->
        <div id="quiz-screen" class="card hidden">
            <span class="question-tag" id="q-tag">Tópico</span>
            <h2 id="q-text">Pergunta aqui?</h2>
            <div class="options-grid" id="options-container">
                <!-- Opções geradas via JS -->
            </div>
        </div>

        <!-- Tela de Resultado -->
        <div id="result-screen" class="card hidden">
            <h2>Resultados Finais</h2>
            <div class="score-circle" id="score-circle">
                <div class="score-inner">
                    <span class="score-number" id="final-score">0</span>
                    <span class="score-label">Pontos</span>
                </div>
            </div>
            <p id="result-message" class="hero-desc" style="margin-bottom: 1rem;"></p>
            
            <div id="error-section" class="hidden">
                <h3 style="text-align: left; margin-bottom: 1rem; color: var(--error);">Revisão dos Erros</h3>
                <div class="error-list" id="error-list">
                    <!-- Lista de erros gerada via JS -->
                </div>
            </div>

            <button class="btn-primary" style="margin-top: 2rem;" onclick="restartQuiz()">Tentar Novamente</button>
        </div>
    </main>
