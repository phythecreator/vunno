<!DOCTYPE html>
<html lang='pt'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Color Shift Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{overflow:hidden;background:#111;color:#fff}
canvas{display:block;background:linear-gradient(#1a1a1a,#0b0b0b)}
#ui{
position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);
padding:12px;border-radius:12px;backdrop-filter:blur(8px)
}
#menu{
position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;background:rgba(0,0,0,.85);
gap:12px
}
button,select{
padding:12px 20px;border:none;border-radius:10px;
background:#3b82f6;color:white;font-size:16px;cursor:pointer
}
button:hover{filter:brightness(1.1)}
h1{font-size:42px;text-shadow:0 0 20px #3b82f6}
#mobile{
position:absolute;bottom:20px;left:20px;display:none;gap:10px;flex-wrap:wrap;max-width:160px
}
.mobileBtn{
width:70px;height:70px;border-radius:50%;
background:rgba(255,255,255,.15);display:flex;align-items:center;
justify-content:center;font-size:28px;color:white;user-select:none
}
@media (max-width: 768px){
#mobile{display:flex}
}
</style>
</head>
<body>
<div id='menu'>
<h1>Color Shift Arena</h1>
<select id='mapSelect'>
<option value='0'>Neon City</option>
<option value='1'>Forest Grid</option>
<option value='2'>Lava Core</option>
</select>
<button id='startBtn'>Jogar</button>
<p>WASD/Setas para mover • Espaço para mudar cor</p>
</div>

<div id='ui' style='display:none'>
<div>Pontos: <span id='score'>0</span></div>
<div>Nível: <span id='level'>1</span></div>
<div>Melhor: <span id='best'>0</span></div>
</div>

<canvas id='game'></canvas>

<div id='mobile'>
<div class='mobileBtn' data-k='ArrowUp'>▲</div>
<div class='mobileBtn' data-k='ArrowLeft'>◀</div>
<div class='mobileBtn' data-k='ArrowDown'>▼</div>
<div class='mobileBtn' data-k='ArrowRight'>▶</div>
<div class='mobileBtn' data-k=' '>🎨</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

const colors=['#ff4d4d','#4dff88','#4db8ff','#ffd24d','#c04dff','#ff7ab6'];
let score=0,level=1,best=+localStorage.getItem('csaBest')||0;
document.getElementById('best').textContent=best;

const keys={};
addEventListener('keydown',e=>{
keys[e.key]=true;
if(e.key===' ') player.changeColor();
});
addEventListener('keyup',e=>keys[e.key]=false);

document.querySelectorAll('.mobileBtn').forEach(btn=>{
btn.addEventListener('touchstart',e=>{e.preventDefault();keys[btn.dataset.k]=true;if(btn.dataset.k===' ')player.changeColor()});
btn.addEventListener('touchend',e=>{e.preventDefault();keys[btn.dataset.k]=false});
});

class Player{
constructor(){
this.x=200;this.y=200;this.r=18;this.speed=4;
this.colorIndex=0;
}
get color(){return colors[this.colorIndex]}
changeColor(){this.colorIndex=(this.colorIndex+1)%colors.length}
update(){
if(keys['w']||keys['W']||keys['ArrowUp']) this.y-=this.speed;
if(keys['s']||keys['S']||keys['ArrowDown']) this.y+=this.speed;
if(keys['a']||keys['A']||keys['ArrowLeft']) this.x-=this.speed;
if(keys['d']||keys['D']||keys['ArrowRight']) this.x+=this.speed;
this.x=Math.max(this.r,Math.min(canvas.width-this.r,this.x));
this.y=Math.max(this.r,Math.min(canvas.height-this.r,this.y));
}
draw(){
ctx.beginPath();
ctx.fillStyle=this.color;
ctx.shadowBlur=20;
ctx.shadowColor=this.color;
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
}
}

class Bot{
constructor(){
this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height;
this.r=16;
this.speed=1+Math.random()*2;
this.color=colors[Math.floor(Math.random()*colors.length)];
this.dx=(Math.random()-.5)*this.speed;
this.dy=(Math.random()-.5)*this.speed;
}
update(){
this.x+=this.dx;
this.y+=this.dy;
if(this.x<this.r||this.x>canvas.width-this.r) this.dx*=-1;
if(this.y<this.r||this.y>canvas.height-this.r) this.dy*=-1;

const dx=player.x-this.x;
const dy=player.y-this.y;
const dist=Math.hypot(dx,dy);
if(dist<150){
this.dx+=(dx/dist)*0.03;
this.dy+=(dy/dist)*0.03;
const mag=Math.hypot(this.dx,this.dy);
this.dx=this.dx/mag*this.speed;
this.dy=this.dy/mag*this.speed;
}
if(dist<player.r+this.r){
if(this.color===player.color){
score+=10;
this.respawn();
spawnParticles(this.x,this.y,this.color);
}else{
gameOver();
}
}
}
respawn(){
this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height;
this.color=colors[Math.floor(Math.random()*colors.length)];
}
draw(){
ctx.beginPath();
ctx.fillStyle=this.color;
ctx.shadowBlur=15;
ctx.shadowColor=this.color;
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
}
}

class PowerUp{
constructor(){this.respawn()}
respawn(){
this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height;
this.r=12;
}
update(){
if(Math.hypot(player.x-this.x,player.y-this.y)<player.r+this.r){
score+=50;
player.speed=Math.min(8,player.speed+0.5);
spawnParticles(this.x,this.y,'#ffffff');
this.respawn();
}
}
draw(){
ctx.beginPath();
ctx.fillStyle='#fff';
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle='#00ffff';
ctx.lineWidth=3;
ctx.stroke();
}
}

const particles=[];
function spawnParticles(x,y,color){
for(let i=0;i<20;i++){
particles.push({
x,y,color,
dx:(Math.random()-.5)*6,
dy:(Math.random()-.5)*6,
life:40
});
}
}
function updateParticles(){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.dx;
p.y+=p.dy;
p.life--;
ctx.globalAlpha=p.life/40;
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,4,4);
ctx.globalAlpha=1;
if(p.life<=0) particles.splice(i,1);
}
}

const maps=[
()=>{ctx.fillStyle='rgba(59,130,246,.08)';for(let x=0;x<canvas.width;x+=50){ctx.fillRect(x,0,2,canvas.height)}for(let y=0;y<canvas.height;y+=50){ctx.fillRect(0,y,canvas.width,2)}},
()=>{for(let i=0;i<100;i++){ctx.fillStyle='rgba(34,197,94,.08)';ctx.beginPath();ctx.arc((i*137)%canvas.width,(i*211)%canvas.height,20,0,Math.PI*2);ctx.fill()}},
()=>{let g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#330000');g.addColorStop(1,'#ff4500');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}
];

let player=new Player();
let bots=[],powerUp=new PowerUp(),mapIndex=0,running=false;

function startGame(){
score=0;level=1;
player=new Player();
bots=Array.from({length:10},()=>new Bot());
powerUp=new PowerUp();
mapIndex=+document.getElementById('mapSelect').value;
running=true;
document.getElementById('menu').style.display='none';
document.getElementById('ui').style.display='block';
}

function gameOver(){
running=false;
best=Math.max(best,score);
localStorage.setItem('csaBest',best);
document.getElementById('best').textContent=best;
document.getElementById('menu').style.display='flex';
document.getElementById('ui').style.display='none';
}

document.getElementById('startBtn').onclick=startGame;

function loop(){
requestAnimationFrame(loop);
ctx.clearRect(0,0,canvas.width,canvas.height);

if(mapIndex!==2){
ctx.fillStyle='#111';
ctx.fillRect(0,0,canvas.width,canvas.height);
}
maps[mapIndex]();

if(!running) return;

player.update();
player.draw();

powerUp.update();
powerUp.draw();

bots.forEach(b=>{b.update();b.draw();});

updateParticles();

level=1+Math.floor(score/200);
while(bots.length<10+level){
bots.push(new Bot());
}

document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
}
loop();
</script>
</body>
</html>
