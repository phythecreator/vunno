<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Alexa Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        button {
            background-color: #00fff0;
            color: #0f3460;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #00bfff;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
        .box {
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 40px;
            text-align: left;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Mini Alexa Web</h2>
    <p>Clica no botão e fala comigo!</p>
    
    <button id="btnOuvir">Falar</button>
    <div class="status" id="status">Status: Inativo</div>

    <p style="margin-top: 20px; text-align: left;"><strong>Tu disseste:</strong></p>
    <div class="box" id="textoOuvido">-</div>

    <p style="text-align: left;"><strong>Resposta da Alexa:</strong></p>
    <div class="box" id="respostaAlexa">-</div>
</div>

<script>
    // Verificar se o navegador suporta o Reconhecimento de Voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("O teu navegador não suporta reconhecimento de voz. Experimenta usar o Google Chrome ou Microsoft Edge.");
    } else {
        const recognition = new SpeechRecognition();
        
        // Define o idioma para Português de Portugal (podes mudar para 'pt-BR' se preferires)
        recognition.lang = 'pt-PT';
        recognition.interimResults = false;

        const btnOuvir = document.getElementById('btnOuvir');
        const statusText = document.getElementById('status');
        const textoOuvido = document.getElementById('textoOuvido');
        const respostaAlexa = document.getElementById('respostaAlexa');

        // Evento de clique no botão
        btnOuvir.addEventListener('click', () => {
            recognition.start();
            statusText.innerText = "Status: A ouvir...";
            btnOuvir.style.backgroundColor = "#ff4757";
        });

        // Quando o navegador reconhece o que falaste
        recognition.onresult = (event) => {
            const comando = event.results[0][0].transcript.toLowerCase();
            textoOuvido.innerText = comando;
            statusText.innerText = "Status: A processar...";
            
            // Processa a resposta adequada
            processarComando(comando);
        };

        // Quando paras de falar
        recognition.onspeechend = () => {
            recognition.stop();
            btnOuvir.style.backgroundColor = "#00fff0";
        };

        // Em caso de erro
        recognition.onerror = (event) => {
            statusText.innerText = "Erro ao ouvir: " + event.error;
            btnOuvir.style.backgroundColor = "#00fff0";
        };

        // Lógica de Perguntas e Respostas
        function processarComando(comando) {
            let resposta = "";

            if (comando.includes("olá") || comando.includes("oi")) {
                resposta = "Olá! Como posso ajudar-te hoje?";
            } 
            else if (comando.includes("quem és tu") || comando.includes("qual é o teu nome")) {
                resposta = "Eu sou a tua assistente de voz criada em HTML e JavaScript!";
            } 
            else if (comando.includes("horas") || comando.includes("que horas são")) {
                const agora = new Date();
                resposta = `Agora são ${agora.getHours()} horas e ${agora.getMinutes()} minutos.`;
            } 
            else if (comando.includes("tudo bem") || comando.includes("como estás")) {
                resposta = "Comigo está tudo ótimo, obrigado por perguntares!";
            } 
            else if (comando.includes("piada") || comando.includes("conta uma piada")) {
                resposta = "O que é que o código disse para o programador? Deixa-me em paz, estou cheio de bugs!";
            } 
            else {
                resposta = "Desculpa, ainda não aprendi a responder a essa pergunta.";
            }

            respostaAlexa.innerText = resposta;
            falar(resposta);
        }

        // Função de Sintetizador de Voz (Text-to-Speech)
        function falar(texto) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-PT'; // Idioma da voz
            
            utterance.onend = () => {
                statusText.innerText = "Status: Inativo";
            };

            synth.speak(utterance);
        }
    }
</script>

</body>
</html>
