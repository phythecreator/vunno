<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meccha Chameleon 3D - Edição Única</title>
    <style>
        body { margin:0; padding:0; overflow:hidden; background:#000; font-family:Arial; }
        header {
            position: absolute; top: 0; left: 0; right: 0;
            background: linear-gradient(#ff00aa, #00ffff);
            padding: 12px; text-align: center; font-size: 26px;
            font-weight: bold; z-index: 100; text-shadow: 0 0 15px #fff;
        }
        #ui {
            position: absolute; top: 70px; left: 15px; background: rgba(0,0,0,0.75);
            padding: 15px; border-radius: 10px; z-index: 100; color: white;
        }
        button {
            background:#ff00aa; color:white; border:none; padding:10px 18px;
            margin:5px; border-radius:6px; font-size:16px; cursor:pointer;
        }
        button:hover { background:#00ffff; color:#000; }
        #timer {
            position: absolute; top: 15px; right: 20px; font-size: 32px;
            font-weight: bold; color: #ff0; text-shadow: 0 0 10px #f00; z-index: 100;
        }
        #status {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 12px 30px; border-radius: 12px;
            font-size: 24px; font-weight: bold; z-index: 100;
        }
        .color-btn {
            width: 45px; height: 45px; border: 3px solid white;
            border-radius: 50%; display: inline-block; margin: 4px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
    <header>MECCHA CHAMELEON 3D - Alta Qualidade</header>
    
    <div id="timer">Tempo: 90s</div>
    <div id="ui">
        <button onclick="startGame()">Novo Jogo</button>
        <button onclick="toggleRole()">Trocar Papel</button>
        <div style="margin:10px 0;">
            Mapa: 
            <button onclick="changeMap(0)">Sala</button>
            <button onclick="changeMap(1)">Floresta</button>
            <button onclick="changeMap(2)">Neon</button>
        </div>
        <div>Bots: <span id="bot-count">5</span></div>
    </div>
    <div id="status">Carregando 3D...</div>

    <script>
        let scene, camera, renderer;
        let playerModel, playerPaintMesh;
        let bots = [];
        let isHider = true;
        let timeLeft = 90;
        let timerInterval, gameRunning = false;
        let currentMap = 0;
        let currentColor = 0xffffff;
        let keys = {};
        
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Luzes
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(10, 20, 10);
            directional.castShadow = true;
            scene.add(directional);

            camera.position.set(0, 8, 15);
            camera.lookAt(0, 2, 0);
        }

        function createPlayer() {
            if (playerModel) scene.remove(playerModel);
            
            // Corpo principal (Chameleon-like)
            const group = new THREE.Group();
            
            // Corpo
            const bodyGeo = new THREE.CapsuleGeometry(1.2, 2.8, 8, 16);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xeeeeee, shininess: 10 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2;
            body.castShadow = true;
            group.add(body);
            
            // Cabeça
            const headGeo = new THREE.SphereGeometry(1.1, 32, 32);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(1.8, 3.5, 0);
            group.add(head);
            
            // Olhos
            const eyeMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), eyeMat);
            eyeL.position.set(2.4, 3.8, 0.6);
            group.add(eyeL);
            const eyeR = eyeL.clone();
            eyeR.position.z = -0.6;
            group.add(eyeR);
            
            playerModel = group;
            scene.add(playerModel);
            
            // Camada de pintura (semi-transparente)
            const paintGeo = new THREE.CapsuleGeometry(1.25, 2.85, 8, 16);
            const paintMat = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                shininess: 30
            });
            playerPaintMesh = new THREE.Mesh(paintGeo, paintMat);
            playerPaintMesh.position.copy(body.position);
            scene.add(playerPaintMesh);
        }

        function createEnvironment(map) {
            // Limpar cena anterior (exceto player)
            while(scene.children.length > 3) {
                scene.remove(scene.children[3]);
            }
            
            if (map === 0) { // Sala
                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(60, 60),
                    new THREE.MeshPhongMaterial({ color: 0x334455 })
                );
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                scene.add(floor);
                
                // Sofá
                const sofa = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 4), new THREE.MeshPhongMaterial({color:0xff4488}));
                sofa.position.set(-12, 2, 0);
                scene.add(sofa);
            } 
            else if (map === 1) { // Floresta
                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(60, 60),
                    new THREE.MeshPhongMaterial({ color: 0x113322 })
                );
                floor.rotation.x = -Math.PI / 2;
                scene.add(floor);
                
                for (let i = 0; i < 25; i++) {
                    const tree = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.2, 2, 9, 8),
                        new THREE.MeshPhongMaterial({color: 0x228822})
                    );
                    tree.position.set((Math.random()-0.5)*40, 4.5, (Math.random()-0.5)*40);
                    scene.add(tree);
                }
            } 
            else { // Neon
                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(60, 60),
                    new THREE.MeshPhongMaterial({ color: 0x112233, emissive: 0x00aaff })
                );
                floor.rotation.x = -Math.PI / 2;
                scene.add(floor);
                
                const light = new THREE.PointLight(0x00ffff, 2, 100);
                light.position.set(0, 10, 0);
                scene.add(light);
            }
        }

        function createBots(count) {
            bots.forEach(b => scene.remove(b));
            bots = [];
            
            for (let i = 0; i < count; i++) {
                const botGroup = new THREE.Group();
                
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 4, 2.2),
                    new THREE.MeshPhongMaterial({ color: 0xff2222 })
                );
                body.position.y = 2;
                botGroup.add(body);
                
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(1.1, 20, 20),
                    new THREE.MeshPhongMaterial({ color: 0xff4444 })
                );
                head.position.y = 4.8;
                botGroup.add(head);
                
                botGroup.position.set(
                    (Math.random() - 0.5) * 30,
                    0,
                    (Math.random() - 0.5) * 25
                );
                scene.add(botGroup);
                bots.push(botGroup);
            }
        }

        function paintPlayer() {
            if (!playerPaintMesh) return;
            playerPaintMesh.material.color.set(currentColor);
        }

        function startGame() {
            if (!scene) initThree();
            
            createPlayer();
            createEnvironment(currentMap);
            createBots(5);
            gameRunning = true;
            timeLeft = 90;
            
            document.getElementById('status').textContent = isHider ? "Pinte o seu Chameleon 3D!" : "Procure os escondidos!";
            startTimer();
            animate();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `Tempo: ${timeLeft}s`;
                if (timeLeft <= 0) endRound();
            }, 1000);
        }

        function endRound() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('status').textContent = "Fim da Rodada!";
        }

        function toggleRole() {
            isHider = !isHider;
            document.getElementById('status').textContent = isHider ? "Modo Hider ativado" : "Modo Seeker ativado";
        }

        function changeMap(n) {
            currentMap = n;
            if (gameRunning) {
                createEnvironment(n);
            }
        }

        function animate() {
            if (!gameRunning) return;
            
            requestAnimationFrame(animate);
            
            // Movimento do jogador
            const speed = 0.4;
            if (keys['w'] || keys['ArrowUp']) playerModel.position.z -= speed;
            if (keys['s'] || keys['ArrowDown']) playerModel.position.z += speed;
            if (keys['a'] || keys['ArrowLeft']) playerModel.position.x -= speed;
            if (keys['d'] || keys['ArrowRight']) playerModel.position.x += speed;
            
            // Rotação suave
            if (keys['a'] || keys['ArrowLeft']) playerModel.rotation.y = 1.2;
            else if (keys['d'] || keys['ArrowRight']) playerModel.rotation.y = -1.2;
            else playerModel.rotation.y *= 0.9;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        // Controles de cor
        window.setColor = function(hex) {
            currentColor = hex;
            paintPlayer();
        };
        
        // UI de cores
        const colorsDiv = document.createElement('div');
        colorsDiv.style.position = 'absolute';
        colorsDiv.style.bottom = '30px';
        colorsDiv.style.left = '50%';
        colorsDiv.style.transform = 'translateX(-50%)';
        colorsDiv.style.zIndex = '100';
        document.body.appendChild(colorsDiv);
        
        const colorList = [0xffffff, 0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xff8800];
        colorList.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = '#' + c.toString(16).padStart(6,'0');
            btn.onclick = () => setColor(c);
            colorsDiv.appendChild(btn);
        });
        
        // Inicialização
        window.onload = () => {
            initThree();
            createEnvironment(0);
            createPlayer();
            document.getElementById('status').textContent = "Pronto! Clique em Novo Jogo para começar.";
        };
        
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
