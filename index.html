<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lockdown Simulator - V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --card: #111; --text: #eee; --accent: #ff1801; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Geist', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        .quiz-container { width: 90%; max-width: 600px; background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 16px; text-align: center; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid var(--border); color: white; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 16px; }
        .option-btn:hover { border-color: var(--accent); background: #222; }
        #timer { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 32px; margin-bottom: 20px; font-weight: bold; }
        .hidden { display: none; }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-container" id="quiz-ui">
    <div id="start-screen">
        <h1>F1 SIMULATOR v2.0</h1>
        <p>Modo de Segurança Ativo. Ecrã inteiro obrigatório.</p>
        <button class="option-btn" onclick="initSimulator()">INICIAR PILOTAGEM</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer">20</div>
        <div id="question-text" style="font-size: 20px; margin-bottom: 20px;"></div>
        <div id="options"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 id="final-score"></h2>
        <button class="option-btn" onclick="location.reload()">REINICIAR SIMULADOR</button>
    </div>
</div>

<script>
    const fullQuestionList = [
        { q: "Como se divide a temporada de 24 Grandes Prémios?", o: ["Começa na Austrália e termina em Abu Dhali.", "Começa em Singapura e termina em Las Vegas.", "Começa no Mónaco e termina em Spa.", "Começa em Spa e termina na Austrália."], a: 0 },
        { q: "Qual a distância total que cada circuito deve perfazer?", o: ["50 voltas exatas.", "305 km, variando o número de voltas.", "500 km fixos.", "Distância irrelevante."], a: 1 },
        { q: "Qual a cor da bandeira que indica 'perigo' e obriga o piloto a abrandar?", o: ["Verde", "Azul", "Amarela", "Vermelha"], a: 2 },
        { q: "Qual é a equipa conhecida pela sua 'incrível engenharia'?", o: ["Ferrari", "Mercedes", "Red Bull", "McLaren"], a: 1 },
        { q: "Diferença entre Vácuo (Slipstream) e Ar Sujo?", o: ["Vácuo ganha velocidade; Ar Sujo perde aderência.", "Ar Sujo ajuda; Vácuo perde aderência.", "Ambos iguais.", "Vácuo proibido."], a: 0 },
        { q: "Composto de pneu 'Muito rápido, mas dura poucas voltas'?", o: ["Médio", "Duro", "Macio", "Intermédio"], a: 2 },
        { q: "O que diz o resumo sobre a velocidade na Pit Lane?", o: ["É livre.", "Limitada a 80km/h (ou 60km/h no Mónaco).", "Limitada a 100km/h.", "Igual à reta principal."], a: 1 },
        { q: "Principal característica do circuito do Mónaco?", o: ["Pista de alta velocidade.", "Circuito urbano e limites reduzidos na pitlane.", "Teto orçamental não se aplica.", "Safety Car não entra."], a: 1 },
        { q: "Piloto que substitui Hamilton na Mercedes em 2025?", o: ["Max Verstappen", "Kimi Antonelli", "Charles Leclerc", "Fernando Alonso"], a: 1 },
        { q: "O que significa a Bandeira Azul?", o: ["Mau comportamento.", "Aviso para dar passagem ao líder.", "Corrida interrompida.", "Pista livre."], a: 1 },
        { q: "Qual é a cor da equipa McLaren?", o: ["Vermelho", "Azul escuro", "Laranja papaya", "Preto e prata"], a: 2 },
        { q: "O que acontece na paragem sob Safety Car?", o: ["Perde 25s.", "Perde apenas 10-12s ('pit stop grátis').", "Paragem proibida.", "Ganha volta de avanço."], a: 1 },
        { q: "Por que as zonas de travagem são os melhores locais de ultrapassagem?", o: ["Onde o DRS é obrigatório.", "Onde os carros reduzem drasticamente a velocidade.", "Onde os pneus duram mais.", "FIA não fiscaliza."], a: 1 },
        { q: "Como explica o resumo a estratégia de 'Undercut'?", o: ["Ficar em pista.", "Parar antes do rival para trocar de pneus.", "Ultrapassar por fora.", "Esperar desclassificação."], a: 1 },
        { q: "Papel da FIA com carros dobrados durante o Safety Car?", o: ["Impede que ultrapassem.", "Permite passagem para limpar o trânsito.", "Obriga a sair.", "Dá penalização."], a: 1 },
        { q: "O que o Hamilton alcançou em recordes?", o: ["Vitórias e Pole Position.", "Paragens nas boxes.", "Multas na pitlane.", "Voltas rápidas."], a: 0 },
        { q: "Erro no semáforo das boxes pode causar:", o: ["Multa FIA.", "Deitar tudo a perder (perda de tempo).", "Troca de motor.", "Desclassificação imediata."], a: 1 }
    ];

    let currentQ = 0;
    let score = 0;
    let timeLeft = 20;
    let timer = null;
    let gameQuestions = [];

    function initSimulator() {
        // Copia e baralha as perguntas
        gameQuestions = [...fullQuestionList].sort(() => Math.random() - 0.5);
        
        // Ativar Fullscreen
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= gameQuestions.length) return endQuiz();
        
        timeLeft = 20;
        document.getElementById('timer').innerText = timeLeft;
        
        const qData = gameQuestions[currentQ];
        document.getElementById('question-text').innerText = qData.q;
        
        const optsContainer = document.getElementById('options');
        optsContainer.innerHTML = '';
        
        // Baralhar opções mantendo o índice correto
        const optionsWithIndex = qData.o.map((text, idx) => ({ text, isCorrect: idx === qData.a }));
        optionsWithIndex.sort(() => Math.random() - 0.5);

        optionsWithIndex.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => validate(opt.isCorrect);
            optsContainer.appendChild(btn);
        });

        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) validate(false);
        }, 1000);
    }

    function validate(isCorrect) {
        clearInterval(timer);
        if (isCorrect) score++;
        currentQ++;
        loadQuestion();
    }

    function endQuiz() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const finalPercent = Math.round((score / gameQuestions.length) * 100);
        document.getElementById('final-score').innerText = `RESULTADO FINAL: ${finalPercent}/100`;
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) alert("ALERTA: Saíste da pista! Foca-te no ecrã.");
    });
</script>
</body>
</html>
